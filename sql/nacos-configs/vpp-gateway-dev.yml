spring:
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    timeout: 1000
    jedis:
      pool:
        max-active: 10
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
  cloud:
    gateway:
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        - id: vpp-auth
          uri: lb://vpp-auth
          predicates:
            - Path=/auth/**
          filters:
            - CacheRequestFilter
            - ValidateCodeFilter
            - StripPrefix=1
        - id: vpp-gen
          uri: lb://vpp-gen
          predicates:
            - Path=/code/**
          filters:
            - StripPrefix=1
        - id: vpp-system
          uri: lb://vpp-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        - id: vpp-file
          uri: lb://vpp-file
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=1
        - id: vpp-monitor
          uri: lb://vpp-monitor
          predicates:
            - Path=/monitor/**
          filters:
            - StripPrefix=1
        - id: vpp-job
          uri: lb://vpp-job
          predicates:
            - Path=/job/**
          filters:
            - StripPrefix=1
        - id: vpp-event-service
          uri: lb://vpp-event-service
          predicates:
            - Path=/vpp-event/**
          filters:
            - StripPrefix=1
        - id: vpp-dispatch-service
          uri: lb://vpp-dispatch-service
          predicates:
            - Path=/vpp-dispatch/**
          filters:
            - StripPrefix=1
security:
  captcha:
    enabled: false
    type: math
  xss:
    enabled: true
    excludeUrls:
      - /system/notice
  ignore:
    whites:
      - /auth/logout
      - /auth/login
      - /auth/register
      - /*/v2/api-docs
      - /csrf
      - /job/api/callback
      - /job/api/registry
      - /job/api/registryRemove
      - /file/documents/**
