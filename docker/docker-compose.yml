version : '3.8'
networks:
  cloud-net:
    name: cloud-net
    ipam:
      config:
        - subnet: 172.18.0.0/16
services:
  witos-nacos:
    container_name: witos-nacos
    build:
      context: ./nacos
    environment:
      - MODE=standalone
      - MYSQL_HOST=witos-mysql
      - MYSQL_USER=root
      - MYSQL_PWD=password
    volumes:
      - ./nacos/logs/:/home/witos/logs
      # 通过环境变量配置数据库相关信息
      #- ./nacos/conf/bootstrap.yml:/home/witos/conf/bootstrap.yml
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - witos-mysql
    networks:
      cloud-net:
        ipv4_address: 172.18.0.6
  witos-mysql:
    container_name: witos-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
      - ./mysql/db:/docker-entrypoint-initdb.d
    command: [
      'mysqld',
      '--innodb-buffer-pool-size=80M',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-time-zone=+8:00',
      '--lower-case-table-names=1'
    ]
    environment:
      # 业务库 vpp_platform 由 mysql/db 下的 vpp_platform.sql 初始化脚本创建，此处不再通过 MYSQL_DATABASE 预建，避免与脚本内 CREATE DATABASE 冲突（仅创建空库供 nacos 等使用）
      MYSQL_DATABASE: 'witos_config'
      MYSQL_ROOT_PASSWORD: password
    networks:
      cloud-net:
        ipv4_address: 172.18.0.2
  witos-redis:
    container_name: witos-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/witos/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/witos/redis/redis.conf
    networks:
      cloud-net:
        ipv4_address: 172.18.0.3
  witos-nginx:
    container_name: witos-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/witos/projects/witos-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - vpp-gateway
    links:
      - vpp-gateway
    networks:
      cloud-net:
        ipv4_address: 172.18.0.4
  vpp-gateway:
    container_name: vpp-gateway
    build:
      context: vpp/gateway
      dockerfile: dockerfile
    ports:
      - "48080:48080"
    depends_on:
      - witos-nacos
      - witos-redis
    links:
      - witos-redis
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.5
    networks:
      cloud-net:
        ipv4_address: 172.18.0.5
  vpp-auth:
    container_name: vpp-auth
    build:
      context: vpp/auth
      dockerfile: dockerfile
    ports:
      - "39200:39200"
    depends_on:
      - witos-redis
    links:
      - witos-redis
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.7
    networks:
      cloud-net:
        ipv4_address: 172.18.0.7
  vpp-system:
    container_name: vpp-system
    build:
      context: vpp/modules/system
      dockerfile: dockerfile
    ports:
      - "39201:39201"
    depends_on:
      - witos-redis
      - witos-mysql
    links:
      - witos-redis
      - witos-mysql
      - vpp-file
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.8
    networks:
      cloud-net:
        ipv4_address: 172.18.0.8
  vpp-gen:
    container_name: vpp-gen
    build:
      context: vpp/modules/gen
      dockerfile: dockerfile
    ports:
      - "39202:39202"
    depends_on:
      - witos-mysql
    links:
      - witos-mysql
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.9
    networks:
      cloud-net:
        ipv4_address: 172.18.0.9
  vpp-file:
    container_name: vpp-file
    build:
      context: vpp/modules/file
      dockerfile: dockerfile
    ports:
      - "39300:39300"
    volumes:
      - ./vpp/uploadPath:/home/witos/uploadPath
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.10
    networks:
      cloud-net:
        ipv4_address: 172.18.0.10
  vpp-monitor:
    container_name: vpp-monitor
    build:
      context: vpp/visual/monitor
      dockerfile: dockerfile
    ports:
      - "39100:39100"
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.11
    networks:
      cloud-net:
        ipv4_address: 172.18.0.11
  vpp-job:
    container_name: vpp-job
    build:
      context: vpp/modules/job
      dockerfile: dockerfile
    ports:
      - "39204:39204"
    depends_on:
      - witos-redis
      - witos-mysql
    links:
      - witos-redis
      - witos-mysql
      - vpp-file
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.13
    networks:
      cloud-net:
        ipv4_address: 172.18.0.13
  vpp-event-service:
    container_name: vpp-event-service
    build:
      context: vpp/event-service
      dockerfile: dockerfile
    ports:
      - "39310:39310"
    depends_on:
      - witos-nacos
      - witos-mysql
    links:
      - witos-mysql
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.14
    networks:
      cloud-net:
        ipv4_address: 172.18.0.14
  vpp-dispatch-service:
    container_name: vpp-dispatch-service
    build:
      context: vpp/dispatch-service
      dockerfile: dockerfile
    ports:
      - "39320:39320"
    depends_on:
      - witos-nacos
      - witos-mysql
    links:
      - witos-mysql
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.15
    networks:
      cloud-net:
        ipv4_address: 172.18.0.15
